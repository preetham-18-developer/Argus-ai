<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" style="background:#090d16; border-radius: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <linearGradient id="purpleNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0844" />
      <stop offset="100%" stop-color="#FFB199" />
    </linearGradient>

    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#60EFFF" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes spinCW {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCCW {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulseTarget {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 12px #00F2FE); }
    }
    @keyframes scanSweep {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(320px); opacity: 0.2; }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    @keyframes waveAudio {
      0%, 100% { height: 8px; }
      50% { height: 28px; }
    }

    .spin-ring { transform-origin: 980px 210px; animation: spinCW 20s linear infinite; }
    .spin-ring-fast { transform-origin: 980px 210px; animation: spinCCW 12s linear infinite; }
    .pulse-target { transform-origin: 980px 210px; animation: pulseTarget 3s ease-in-out infinite; }
    .scan-beam { animation: scanSweep 4s ease-in-out infinite; }
    .blinker { animation: blinkDot 1.5s ease-in-out infinite; }
    
    .audio-bar-1 { animation: waveAudio 1.2s ease-in-out infinite 0.1s; }
    .audio-bar-2 { animation: waveAudio 1.2s ease-in-out infinite 0.4s; }
    .audio-bar-3 { animation: waveAudio 1.2s ease-in-out infinite 0.2s; }
    .audio-bar-4 { animation: waveAudio 1.2s ease-in-out infinite 0.6s; }
    .audio-bar-5 { animation: waveAudio 1.2s ease-in-out infinite 0.3s; }
  </style>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.05">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300 M 0 360 L 1200 360" stroke="#FFFFFF" stroke-width="1" />
    <path d="M 120 0 L 120 420 M 240 0 L 240 420 M 360 0 L 360 420 M 480 0 L 480 420 M 600 0 L 600 420 M 720 0 L 720 420 M 840 0 L 840 420 M 960 0 L 960 420 M 1080 0 L 1080 420" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Left Content Side -->
  <g transform="translate(70, 70)">
    
    <!-- Top Pill Tag -->
    <g transform="translate(0, 0)">
      <rect width="260" height="32" rx="16" fill="#00F2FE" fill-opacity="0.12" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="16" cy="16" r="5" fill="#00FF87" class="blinker" />
      <text x="30" y="21" fill="#00FF87" font-size="13" font-weight="700" letter-spacing="1.2">NEXT-GEN ASSISTIVE AI</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="88" fill="url(#cyanNeon)" font-size="54" font-weight="900" letter-spacing="1" filter="url(#glow)">ARGUS.AI</text>
    <text x="275" y="88" fill="#FFFFFF" font-size="22" font-weight="300" opacity="0.6">| Vision System</text>

    <!-- Tagline -->
    <text x="0" y="126" fill="#E2E8F0" font-size="20" font-weight="600" letter-spacing="0.5">Empowering Visually Impaired Freedom via Real-Time Spatial AI</text>
    
    <!-- Description -->
    <text x="0" y="160" fill="#94A3B8" font-size="14" font-weight="400" width="580">
      <tspan x="0" dy="0">Integrated multi-module ecosystem: AI Object Detection, Night Vision Boost,</tspan>
      <tspan x="0" dy="22">Queue Navigation, Multimodal Scene Explanation & Spatial Audio Alerts.</tspan>
    </text>

    <!-- Tech Badges inside Banner -->
    <g transform="translate(0, 215)">
      <!-- Badge 1: Real-time YOLOv8 / COCO -->
      <g transform="translate(0, 0)">
        <rect width="150" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" fill="#00F2FE" font-size="12" font-weight="700">🎯 COCO-SSD / YOLO</text>
      </g>
      <!-- Badge 2: Night Vision WebGL -->
      <g transform="translate(160, 0)">
        <rect width="140" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" fill="#FFB199" font-size="12" font-weight="700">🌙 WebGL NightSight</text>
      </g>
      <!-- Badge 3: Gemini Vision -->
      <g transform="translate(310, 0)">
        <rect width="145" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" fill="#A78BFA" font-size="12" font-weight="700">🧠 Multimodal AI</text>
      </g>
      <!-- Badge 4: Audio Feedback -->
      <g transform="translate(465, 0)">
        <rect width="140" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" fill="#00FF87" font-size="12" font-weight="700">🔊 Voice & Spatial</text>
      </g>
    </g>
  </g>

  <!-- Right Visual Side: HUD Target Reticle Radar Animation -->
  <g transform="translate(0, 0)">
    <!-- Outer Decorative Radar Circle -->
    <circle cx="980" cy="210" r="140" fill="none" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.15" />
    <circle cx="980" cy="210" r="110" fill="none" stroke="#00F2FE" stroke-width="1" stroke-dasharray="6,6" stroke-opacity="0.3" class="spin-ring" />
    <circle cx="980" cy="210" r="75" fill="none" stroke="#FF0844" stroke-width="1.5" stroke-dasharray="12,12" stroke-opacity="0.5" class="spin-ring-fast" />

    <!-- Center Target Reticle -->
    <g class="pulse-target">
      <circle cx="980" cy="210" r="45" fill="#00F2FE" fill-opacity="0.05" stroke="#00F2FE" stroke-width="2" filter="url(#subtleGlow)"/>
      <circle cx="980" cy="210" r="6" fill="#00FF87" filter="url(#glow)"/>
      <!-- Crosshairs -->
      <path d="M 980 150 L 980 180 M 980 240 L 980 270 M 920 210 L 950 210 M 1010 210 L 1040 210" stroke="#00F2FE" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Detected Bounding Box HUD Mock -->
    <g transform="translate(870, 90)">
      <rect width="130" height="90" fill="none" stroke="#00FF87" stroke-width="2" stroke-dasharray="4" rx="4"/>
      <rect width="90" height="20" fill="#00FF87" rx="3" y="-10" x="5"/>
      <text x="10" y="4" fill="#090d16" font-size="10" font-weight="900">OBSTACLE 0.8M</text>
    </g>

    <g transform="translate(970, 230)">
      <rect width="110" height="110" fill="none" stroke="#00F2FE" stroke-width="2" rx="4"/>
      <rect width="80" height="18" fill="#00F2FE" rx="3" y="-9" x="5"/>
      <text x="10" y="4" fill="#090d16" font-size="9" font-weight="900">PERSON 99%</text>
    </g>

    <!-- Animated Voice Waveform Indicator -->
    <g transform="translate(860, 340)">
      <rect width="240" height="40" rx="10" fill="#1E293B" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="1"/>
      <text x="15" y="24" fill="#94A3B8" font-size="11" font-weight="700">AUDIO FEEDBACK</text>
      <!-- Audio bars -->
      <g transform="translate(140, 20)">
        <rect x="0" y="-14" width="4" height="28" fill="#00FF87" rx="2" class="audio-bar-1"/>
        <rect x="8" y="-14" width="4" height="28" fill="#00F2FE" rx="2" class="audio-bar-2"/>
        <rect x="16" y="-14" width="4" height="28" fill="#00FF87" rx="2" class="audio-bar-3"/>
        <rect x="24" y="-14" width="4" height="28" fill="#00F2FE" rx="2" class="audio-bar-4"/>
        <rect x="32" y="-14" width="4" height="28" fill="#00FF87" rx="2" class="audio-bar-5"/>
      </g>
    </g>
  </g>
</svg>
