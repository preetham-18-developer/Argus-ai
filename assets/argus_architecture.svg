<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%" style="background:#090d16; border-radius: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes movePulse {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodeGlow {
      0%, 100% { filter: drop-shadow(0 0 4px #00F2FE); }
      50% { filter: drop-shadow(0 0 14px #00FF87); }
    }
    .flow-path {
      stroke: url(#flowGrad);
      stroke-width: 3;
      stroke-dasharray: 10, 10;
      animation: movePulse 1.5s linear infinite;
    }
    .glow-box { animation: nodeGlow 3s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1000" height="320" fill="#090d16" rx="16"/>

  <!-- Title -->
  <text x="40" y="40" fill="#FFFFFF" font-size="16" font-weight="800" letter-spacing="1">ARGUS AI — HIGH-THROUGHPUT PIPELINE ARCHITECTURE</text>

  <!-- Connecting Animated Pipes -->
  <path d="M 180 160 L 290 160" class="flow-path"/>
  <path d="M 470 160 L 570 160" class="flow-path"/>
  <path d="M 750 160 L 840 160" class="flow-path"/>

  <!-- PIPELINE STAGES -->

  <!-- Stage 1: Camera Video Capture -->
  <g transform="translate(30, 95)" class="glow-box">
    <rect width="150" height="130" rx="12" fill="#1E293B" stroke="#00F2FE" stroke-width="2"/>
    <circle cx="75" cy="50" r="22" fill="#00F2FE" fill-opacity="0.15"/>
    <text x="63" y="58" fill="#00F2FE" font-size="24">📷</text>
    <text x="75" y="95" fill="#FFFFFF" font-size="13" font-weight="800" text-anchor="middle">Live Camera</text>
    <text x="75" y="112" fill="#94A3B8" font-size="10" text-anchor="middle">60 FPS Video Stream</text>
  </g>

  <!-- Stage 2: Smart Frame Skippers -->
  <g transform="translate(290, 95)">
    <rect width="180" height="130" rx="12" fill="#1E293B" stroke="#00FF87" stroke-width="2"/>
    <circle cx="90" cy="50" r="22" fill="#00FF87" fill-opacity="0.15"/>
    <text x="78" y="58" fill="#00FF87" font-size="24">⚡</text>
    <text x="90" y="95" fill="#FFFFFF" font-size="13" font-weight="800" text-anchor="middle">Frame Skipper</text>
    <text x="90" y="112" fill="#00FF87" font-size="10" font-weight="700" text-anchor="middle">1/10 Frame (10x Speed)</text>
  </g>

  <!-- Stage 3: AI Inference Engine -->
  <g transform="translate(570, 75)" class="glow-box">
    <rect width="180" height="170" rx="12" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/>
    <circle cx="90" cy="45" r="22" fill="#A78BFA" fill-opacity="0.15"/>
    <text x="78" y="53" fill="#A78BFA" font-size="24">🧠</text>
    <text x="90" y="85" fill="#FFFFFF" font-size="13" font-weight="800" text-anchor="middle">Multi-AI Core</text>
    <text x="90" y="105" fill="#94A3B8" font-size="10" text-anchor="middle">• COCO-SSD Obstacle</text>
    <text x="90" y="122" fill="#94A3B8" font-size="10" text-anchor="middle">• WebGL NightSight</text>
    <text x="90" y="139" fill="#94A3B8" font-size="10" text-anchor="middle">• Gemini / LLaMA Vision</text>
    <text x="90" y="156" fill="#94A3B8" font-size="10" text-anchor="middle">• Queue Density</text>
  </g>

  <!-- Stage 4: Voice & Spatial Output -->
  <g transform="translate(840, 95)">
    <rect width="130" height="130" rx="12" fill="#1E293B" stroke="#FF0844" stroke-width="2"/>
    <circle cx="65" cy="50" r="22" fill="#FF0844" fill-opacity="0.15"/>
    <text x="53" y="58" fill="#FF0844" font-size="24">🔊</text>
    <text x="65" y="95" fill="#FFFFFF" font-size="13" font-weight="800" text-anchor="middle">Spatial Voice</text>
    <text x="65" y="112" fill="#FFB199" font-size="10" font-weight="700" text-anchor="middle">&amp; SOS Dispatch</text>
  </g>
</svg>
