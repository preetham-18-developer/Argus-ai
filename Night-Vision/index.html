<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PathGuide AI</title>
    <link rel="stylesheet" href="style.css">
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"
        type="text/javascript"></script>
</head>

<body>
    <div id="loading-overlay">
        <h1>Loading PathGuide AI...</h1>
        <p>Please wait while vision resources load.</p>
    </div>

    <!-- Hidden video element for raw camera feed -->
    <video id="videoInput" playsinline style="display:none;"></video>

    <!-- Main canvas for processing and display -->
    <canvas id="canvasOutput"></canvas>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div id="night-vision-indicator" style="display:none;">👁️ Extreme Darkness Mode</div>
        <div id="status-message">Ready</div>
        <button id="start-btn">Start Guidance</button>
        <button id="stop-btn" style="display:none;">Stop</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
