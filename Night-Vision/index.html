<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PathGuide AI</title>
    <link rel="stylesheet" href="style.css">
    <!-- TensorFlow.js & Pretrained COCO-SSD for Robust Obstacle Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <!-- Reusable NightVisionCore Engine -->
    <script src="../assets/night-vision-core.js"></script>

    <!-- OpenCV for Low-Light Adaptive Night-Vision Enhancement -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"
        type="text/javascript"></script>
</head>

<body>
    <div id="loading-overlay">
        <h1>Loading PathGuide AI...</h1>
        <p>Initializing neural obstacle detector & vision enhancement...</p>
    </div>

    <!-- Hidden video element for raw camera feed -->
    <video id="videoInput" playsinline style="display:none;"></video>

    <!-- Main canvas for processing and display -->
    <canvas id="canvasOutput"></canvas>

    <!-- UI Overlay -->
    <a href="../index.html" class="back-btn" id="return-btn" style="position:fixed; top:20px; left:20px; z-index:9999; color:white; text-decoration:none; background:rgba(10,15,25,0.85); backdrop-filter:blur(10px); padding:10px 18px; border-radius:30px; font-size:12px; font-weight:700; border:1px solid rgba(0,242,254,0.4); box-shadow:0 4px 15px rgba(0,0,0,0.4); letter-spacing:1px; transition:all 0.3s ease;">← BACK TO ARGUS HUB</a>

    <!-- Top Controls Bar -->
    <div id="top-controls" style="position:fixed; top:20px; right:20px; z-index:9999; display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end;">
        <!-- Night Vision 3-Mode Selector (AUTO / ON / OFF) -->
        <div id="nv-mode-group" role="radiogroup" aria-label="Night Vision Mode" style="background:rgba(10,15,25,0.88); backdrop-filter:blur(10px); padding:4px 6px; border-radius:30px; border:1px solid rgba(255,255,255,0.2); display:flex; align-items:center; gap:4px;">
            <span style="font-size:11px; font-weight:700; color:#94a3b8; padding:0 6px;">🌙 Night Vision:</span>
            <button class="nv-mode-btn active" data-mode="AUTO" aria-checked="true" role="radio" style="background:#00E676; color:#000; border:none; border-radius:20px; padding:4px 10px; font-size:11px; font-weight:700; cursor:pointer; transition:all 0.2s ease;">AUTO</button>
            <button class="nv-mode-btn" data-mode="ON" aria-checked="false" role="radio" style="background:transparent; color:#fff; border:none; border-radius:20px; padding:4px 10px; font-size:11px; font-weight:700; cursor:pointer; transition:all 0.2s ease;">ON</button>
            <button class="nv-mode-btn" data-mode="OFF" aria-checked="false" role="radio" style="background:transparent; color:#fff; border:none; border-radius:20px; padding:4px 10px; font-size:11px; font-weight:700; cursor:pointer; transition:all 0.2s ease;">OFF</button>
        </div>

        <label style="background:rgba(10,15,25,0.88); backdrop-filter:blur(10px); padding:8px 16px; border-radius:30px; font-size:12px; font-weight:700; border:1px solid rgba(255,255,255,0.2); display:flex; align-items:center; gap:8px; cursor:pointer;">
            <span>Voice Guidance</span>
            <input type="checkbox" id="voice-toggle" checked style="accent-color:#00E676; cursor:pointer;">
        </label>
    </div>

    <div id="ui-layer" role="status" aria-live="polite">
        <div id="night-vision-indicator" style="display:none; font-size:13px; font-weight:700; padding:6px 14px; border-radius:20px; background:rgba(0,0,0,0.8); border:1px solid #00F2FE; color:#00F2FE; margin-bottom:8px;">👁️ Night Vision Active</div>
        <div id="status-message">PathGuide Pro Ready</div>
        <div id="caution-note" style="font-size:13px; color:#cbd5e1; margin-top:6px; text-shadow:1px 1px 3px black; text-align:center;">Assists with visible obstacles. Use mobility cane for steps & drop-offs.</div>
        <button id="start-btn">Start Guidance</button>
        <button id="stop-btn" style="display:none;">Stop</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
