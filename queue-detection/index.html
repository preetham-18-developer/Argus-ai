<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Essential for Mobile Camera / Mic Access -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>AI Queue Assistant</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Correct TensorFlow.js Core & COCO-SSD for Robust Multi-Person Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <!-- MoveNet & Pose Detection Dependencies (Fallback support) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
</head>

<body>
    <div id="container">

        <!-- Camera feed -->
        <video id="webcam" playsinline autoplay muted></video>

        <!-- AI drawing layer -->
        <canvas id="output"></canvas>

        <!-- Top Metrics HUD -->
        <div id="hud-panel" class="hud-panel" role="region" aria-label="Queue Metrics">
            <div class="hud-badges">
                <div class="hud-pill queue-count-pill">
                    <span class="hud-label">IN QUEUE</span>
                    <span id="queue-count-val" class="hud-value">0</span>
                </div>
                <div class="hud-pill total-count-pill">
                    <span class="hud-label">TOTAL VISIBLE</span>
                    <span id="total-count-val" class="hud-value">0</span>
                </div>
                <div class="hud-pill status-pill">
                    <span class="hud-label">QUEUE FLOW</span>
                    <span id="flow-status-val" class="hud-value">SCANNING</span>
                </div>
                <div class="hud-pill distance-pill" id="distance-pill">
                    <span class="hud-label">DISTANCE</span>
                    <span id="distance-status-val" class="hud-value">CLEAR</span>
                </div>
            </div>

            <div class="hud-controls">
                <button id="roi-toggle-btn" class="hud-btn" title="Toggle Queue Region">Corridor: Center</button>
                <label class="voice-switch-label" title="Toggle Audio Guidance">
                    <span>Voice</span>
                    <input type="checkbox" id="voice-toggle" checked>
                    <span class="slider round"></span>
                </label>
            </div>
        </div>

        <!-- Status Overlay -->
        <div id="status-overlay" role="status" aria-live="polite">
            <!-- Dedicated Personal Distance Guidance Directive -->
            <div id="guidance-banner" class="guidance-banner state-clear">
                <span id="guidance-action-icon">🎯</span>
                <span id="guidance-action-text">Path clear — No person ahead</span>
            </div>

            <!-- Queue Metrics & Spatial Status -->
            <p id="status-text">Waiting for camera…</p>
            <p id="debug-info">Initializing multi-person queue engine...</p>
            <div id="service-notice" class="service-notice">⏱️ Waiting time: Unavailable (requires measured service rate)</div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen">
            <button id="start-btn">Tap to Start Assistant</button>
            <p>Please allow camera permission when prompted.</p>
        </div>

    </div>

    <!-- Return Button -->
    <a id="returnBtn" href="../index.html">Return</a>

    <!-- MAIN LOGIC FILE -->
    <script src="app.js"></script>

    <!-- VOICE COMMAND HANDLER FOR 'RETURN' -->
    <script>
        (() => {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                console.warn("Speech Recognition not supported.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = "en-US";

            recognition.onresult = (e) => {
                const text = e.results[e.results.length - 1][0].transcript.toLowerCase();
                console.log("🎤 Transcript:", text);

                if (text.includes("return") ||
                    text.includes("go back") ||
                    text.includes("exit") ||
                    text.includes("exit mode")) {
                    window.location.href = "../index.html";
                }
            };

            recognition.onend = () => {
                try { recognition.start(); } catch (e) { }
            };

            try { recognition.start(); } catch (e) {
                console.warn("Speech recognition failed to start.");
            }
        })();
    </script>

</body>

</html>
